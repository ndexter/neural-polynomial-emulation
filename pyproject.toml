[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-polynomial-emulation"
version = "0.5.0"
description = "Constructive neural emulators for probability-normalized polynomial bases."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

authors = [
    { name = "Nick Dexter" }
]

dependencies = [
    "numpy>=1.23",
    "torch>=2.0",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/ndexter/neural-polynomial-emulation"
Repository = "https://github.com/ndexter/neural-polynomial-emulation"
Issues = "https://github.com/ndexter/neural-polynomial-emulation/issues"

[project.optional-dependencies]
test = ["pytest>=7", "sympy>=1.12"]
examples = ["matplotlib>=3.6", "pandas>=1.5"]
notebook = [
    "jupyter>=1",
    "matplotlib>=3.6",
    "mpmath>=1.3",
    "pandas>=1.5",
    "plotly>=5.18",
    "sympy>=1.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
