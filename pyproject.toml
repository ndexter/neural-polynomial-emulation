[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-polynomial-emulation"
version = "0.3.0"
description = "Constructive neural emulators for probability-normalized polynomial bases."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "torch>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]
examples = ["matplotlib>=3.6", "pandas>=1.5"]
notebook = ["jupyter>=1", "matplotlib>=3.6", "pandas>=1.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
